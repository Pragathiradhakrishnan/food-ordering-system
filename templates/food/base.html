{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %} {% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="{% static 'food/style.css' %}">
</head>
<body>
<!--Navbar-->
<nav class="navbar navbar-expand-lg bg-dark navbar-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'home' %}"><h1 style="font-size: 100px;">🍔 Foodie</h1></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"> <a class="nav-link {% if request.resolver_match.url_name == 'home' %}active fw-bold text-decoration-underline{% endif %}" href="{% url 'home' %}" style="font-size: 45px; color: yellow"> Home</a> </li>
                <li class="nav-item"> <a class="nav-link {% if request.resolver_match.url_name == 'menu' %}active fw-bold text-decoration-underline{% endif %}" href="{% url 'menu' %}" style="font-size: 45px; color: yellow"> Menu</a> </li>
                <li class="nav-item"> <a class="nav-link {% if request.resolver_match.url_name == 'cart' %}active fw-bold text-decoration-underline{% endif %}" href="{% url 'cart' %}" style="font-size: 45px; color: yellow"> Cart 🛒</a> </li>
            </ul>
        </div>
    </div>
</nav>

<!--Main Content-->

{% block content %}

{% endblock %}

<!--Footer-->

<footer class="bg-dark text-white text-center py-3 mt-5">
    <p class="mb-0">© 2026 Foodie | Delicious food, delivered with love ❤️</p>
</footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</body>
</html>
