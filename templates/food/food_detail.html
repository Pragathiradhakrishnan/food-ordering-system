{% extends 'food/base.html' %}

{% block title %}
{{ food.name }} - Foodie
{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row align-items-center">
<!--        Image-->
        <div class="col-md-6">
            {% if food.image %}
            <img src="{{food.image.url}}" class="img-fluid rounded shadow" style="width: 100%; height: 400px; object-fit: cover">
            {% endif %}
        </div>
<!--        Detail-->
        <div class="col-md-6">
            <h1 class="fw-bold">{{food.name}}</h1>
            <p class="text-muted mt-3">{{food.description}}</p>
            <h2 class="fw-bold mt-4">₹{{food.price}}</h2>
            <p class="mt-3"><strong>Category:</strong>{{food.category.name}}</p>
<!--            Quantity-->
            <div class="mt-4">
                <label class="form-label">Quantity</label>
                <input type="number" value="1" min="1" class="form-control" style="width: 100px">
            </div>
            <a href="{% url 'add_to_cart' food.id %}" class="btn btn-dark btn-lg mt-4">Add to Cart 🛒</a>
        </div>
    </div>
</div>
{% endblock %}
